<!-- Main application page for Sidekick Medical Assistant -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidekick - AI Medical Assistant</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>🏥 Sidekick - AI Medical Assistant</h1>
        <nav>
            <a href="history.html">History</a>
        </nav>
    </header>

    <main class="app-container">
        <!-- Left Panel: Live Transcript -->
        <section class="transcript-panel">
            <h2>📝 Live Transcript</h2>
            <div id="transcript-content" class="transcript-content">
                <!-- Transcript will be appended here -->
            </div>
        </section>

        <!-- Right Panel: Simplified Terms and Questions -->
        <aside class="info-panel">
            <!-- Simplified Terms -->
            <section class="simplified-terms">
                <h2>💡 Simplified Terms</h2>
                <div id="terms-content" class="terms-content">
                    <!-- Simplified terms will be displayed here -->
                </div>
            </section>

            <!-- Suggested Questions -->
            <section class="suggested-questions">
                <h2>❓ Questions You Could Ask</h2>
                <ol id="questions-content" class="questions-content">
                    <!-- Questions will be displayed here -->
                </ol>
            </section>
        </aside>
    </main>

    <!-- Controls -->
    <footer class="controls">
        <div class="language-selector">
            <label for="language">🌐 Translate to:</label>
            <select id="language">
                <option value="en">English (No Translation)</option>
                <option value="es">Spanish</option>
                <option value="hi">Hindi</option>
                <option value="zh">Mandarin</option>
                <option value="fr">French</option>
                <option value="ar">Arabic</option>
            </select>
        </div>

        <div class="recording-controls">
            <button id="start-recording" class="btn btn-primary">
                🔴 Start Recording
            </button>
            <button id="stop-recording" class="btn btn-danger" disabled>
                ■ Stop Recording
            </button>
            <span id="recording-indicator" class="recording-indicator hidden"></span>
        </div>
    </footer>

    <!-- Translation Panel (hidden by default) -->
    <section id="translation-panel" class="translation-panel hidden">
        <h3>🔄 Translation</h3>
        <div id="translation-content"></div>
    </section>

    <!-- Summary Modal -->
    <div id="summary-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Visit Summary</h2>
            <div id="summary-content">
                <!-- Summary will be displayed here -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/speech.js"></script>
    <script src="js/app.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
