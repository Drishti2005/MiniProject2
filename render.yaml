services:
  # ── Backend (FastAPI) ─────────────────────────────────────────
  - type: web
    name: sidekick-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # set manually in Render dashboard
      - key: GROQ_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///sidekick.db
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.11"

  # ── Frontend (React/Vite static site) ────────────────────────
  - type: web
    name: sidekick-frontend
    runtime: static
    rootDir: umesh-medanta-complete
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false          # set to https://sidekick-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
