[pytest]
# Pytest configuration for AI service tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Asyncio configuration
asyncio_mode = auto

# Markers
markers =
    asyncio: mark test as async
    slow: mark test as slow running
    integration: mark test as integration test
    property: mark test as property-based test

# Coverage options (install pytest-cov to enable)
addopts =
    --verbose
    --strict-markers
    --tb=short

# Timeout for tests
timeout = 30

# Ignore paths
norecursedirs = .git .tox dist build *.egg __pycache__

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::FutureWarning
    ignore::UserWarning
    ignore::DeprecationWarning
